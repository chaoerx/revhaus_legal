<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Documents - RevHaus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #1976D2;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 40px;
        }
        
        .documents {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }
        
        .document-link {
            display: block;
            padding: 20px 30px;
            background: linear-gradient(135deg, #1976D2 0%, #1565C0 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .document-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .document-link:hover::before {
            left: 100%;
        }
        
        .document-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
        }
        
        .document-link:active {
            transform: translateY(0);
        }
        
        .document-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .document-description {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 14px;
        }
        
        .footer a {
            color: #1976D2;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 36px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .document-link {
                padding: 18px 24px;
            }
            
            .document-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">RevHaus</div>
        <p class="subtitle">Legal Documents</p>
        
        <div class="documents">
            <a href="privacy-policy.html" class="document-link">
                <div class="icon">🔒</div>
                <div class="document-title">Privacy Policy</div>
                <div class="document-description">Learn how we collect, use, and protect your information</div>
            </a>
            
            <a href="terms-of-service.html" class="document-link">
                <div class="icon">📋</div>
                <div class="document-title">Terms of Service</div>
                <div class="document-description">Read our terms and conditions for using RevHaus</div>
            </a>
        </div>
        
        <div class="footer">
            <p>Last Updated: December 2024</p>
            <p style="margin-top: 10px;">
                Questions? <a href="mailto:admin@revhaus.club">Contact Us</a>
            </p>
        </div>
    </div>
</body>
</html>
